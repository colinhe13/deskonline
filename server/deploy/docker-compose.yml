services:
  game-server:
    build: ./server
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "52371:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - game-server
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50040:50000-50040/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"
